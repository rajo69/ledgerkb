name: offline

# Proves there is no accidental network dependency. Every test defaults to the
# fake providers, so the whole suite must pass with no network at all. If this
# workflow fails and ci.yml passes, something started reaching for the network.
#
# Isolation is a network namespace (`unshare --net`), not a firewall rule.
# Dropping OUTPUT globally would also cut the runner's own link to GitHub, so
# the job could never report its result — it just hangs until it is killed.
# A namespace isolates the test process and leaves the runner alone.

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: offline-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  no-egress:
    name: full suite, no network
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.5"
          enable-cache: true
      - run: uv python install 3.13

      - name: install (network still allowed)
        run: uv sync --locked --group dev --extra local

      - name: the suite, inside a network namespace
        env:
          # Deliberately empty. Nothing in the default path may need them.
          OPENROUTER_API_KEY: ""
          OPENAI_API_KEY: ""
          ANTHROPIC_API_KEY: ""
        run: |
          sudo -E env "PATH=$PATH" unshare --net -- bash -euo pipefail -c '
            ip link set lo up

            # If this ever succeeds the workflow is proving nothing, so fail
            # loudly rather than reporting a green run that tested the internet.
            if timeout 8 curl -sS https://pypi.org > /dev/null 2>&1; then
              echo "::error::network is reachable - this job would prove nothing"
              exit 1
            fi
            echo "confirmed: no network"

            # --no-sync so uv cannot quietly reach out mid-run.
            uv run --no-sync pytest -m "not live" --no-cov
          '

      - name: a full ingest, inside a network namespace
        run: |
          sudo -E env "PATH=$PATH" unshare --net -- bash -euo pipefail -c '
            ip link set lo up
            uv run --no-sync python tests/fixtures/build_corpus.py /tmp/offline-check
            cd /tmp/offline-check
            PROJECT="'"$GITHUB_WORKSPACE"'"
            uv run --no-sync --project "$PROJECT" lkb init .
            uv run --no-sync --project "$PROJECT" lkb doctor
            uv run --no-sync --project "$PROJECT" lkb ingest ./corpus
            uv run --no-sync --project "$PROJECT" lkb docs
          '
