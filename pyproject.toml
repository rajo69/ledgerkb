[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "ledgerkb"
version = "0.0.1"
description = "Turn scattered documents into a knowledge base that maintains a position over time."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Steel City AI" }]
keywords = ["knowledge-base", "rag", "knowledge-graph", "okf", "provenance"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Text Processing :: Indexing",
  "Typing :: Typed",
]
dependencies = [
  "pydantic>=2.9", "httpx>=0.27", "numpy>=1.26",
  "typer>=0.12", "rich>=13", "pyyaml>=6",
  "python-dateutil>=2.9", "instructor>=1.6",
]

[project.urls]
Homepage = "https://github.com/rajo69/ledgerkb"
Documentation = "https://github.com/rajo69/ledgerkb/tree/main/docs"
Source = "https://github.com/rajo69/ledgerkb"

[project.optional-dependencies]
local    = ["fastembed>=0.4", "chonkie>=0.4", "trafilatura>=1.12",
            "pypdfium2>=4", "python-docx>=1.1", "openpyxl>=3.1", "selectolax>=0.3",
            "python-pptx>=1.0"]   # MIT; PPTX is in L1's required format list
postgres = ["psycopg[binary]>=3.2", "pgvector>=0.3"]
docling  = ["docling>=2"]
crawl    = ["crawl4ai>=0.4"]
obs      = ["opentelemetry-sdk>=1.27", "opentelemetry-exporter-otlp-proto-http>=1.27"]
eval     = ["ragas>=0.2", "deepeval>=1.4"]
litellm  = ["litellm>=1.50"]
pdf      = ["typst>=0.11"]
vec      = ["sqlite-vec>=0.1.7"]        # optional accelerator; still alpha
all      = ["ledgerkb[local,postgres,docling,crawl,obs,eval,pdf]"]

[project.scripts]
lkb = "ledgerkb.cli.main:app"

[dependency-groups]                      # PEP 735 — dev only, never shipped
dev = ["pytest>=8", "pytest-asyncio", "pytest-cov", "hypothesis", "respx",
       "ruff", "mypy", "import-linter", "pytest-examples"]

[tool.hatch.build.targets.wheel]
packages = ["src/ledgerkb"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E","F","I","N","UP","B","SIM","RUF","ANN","S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN", "S101"]            # asserts and untyped fixtures are fine in tests
# Adapter boundaries are deliberately open: provider kwargs pass through to
# somebody else's SDK, store filters are per-backend, and JSON columns hold
# arbitrary values. Narrowing these to a closed type would be a fiction.
"src/ledgerkb/core/ports.py" = ["ANN401"]
"src/ledgerkb/providers/*.py" = ["ANN401"]
"src/ledgerkb/storage/base.py" = ["ANN401"]
"src/ledgerkb/storage/*/store.py" = ["ANN401"]

[tool.mypy]
strict = true
files = ["src/ledgerkb/core"]

[tool.pytest.ini_options]
addopts = "-q --cov=ledgerkb --cov-report=term-missing"
testpaths = ["tests"]
markers = ["live: requires real provider credentials"]

[tool.coverage.run]
branch = true
source = ["src/ledgerkb"]

# --- import-linter: core/ stays pure -----------------------------------------
[tool.importlinter]
root_packages = ["ledgerkb"]
# Required for the contract below that forbids third-party imports in core/.
include_external_packages = true

[[tool.importlinter.contracts]]
name = "core imports nothing from the rest of ledgerkb"
type = "forbidden"
source_modules = ["ledgerkb.core"]
forbidden_modules = [
  "ledgerkb.storage", "ledgerkb.providers", "ledgerkb.ingest", "ledgerkb.index",
  "ledgerkb.extract", "ledgerkb.ledger", "ledgerkb.project", "ledgerkb.evals",
  "ledgerkb.obs", "ledgerkb.cli",
]

[[tool.importlinter.contracts]]
name = "core imports no third-party package except pydantic"
type = "forbidden"
source_modules = ["ledgerkb.core"]
forbidden_modules = [
  "httpx", "numpy", "typer", "rich", "yaml", "dateutil", "instructor",
  "sqlite3", "openai", "anthropic", "litellm",
]

[[tool.importlinter.contracts]]
name = "layered architecture"
type = "layers"
layers = [
  "ledgerkb.cli",
  "ledgerkb.project | ledgerkb.evals",
  "ledgerkb.ledger",
  "ledgerkb.extract",
  "ledgerkb.index",
  "ledgerkb.ingest",
  "ledgerkb.storage | ledgerkb.providers",
  "ledgerkb.obs",
  "ledgerkb.core",
]
