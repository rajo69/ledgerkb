[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "ledgerkb"
version = "0.0.1"
description = "Turn scattered documents into a knowledge base that maintains a position over time."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Steel City AI" }]
keywords = ["knowledge-base", "rag", "knowledge-graph", "okf", "provenance"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Text Processing :: Indexing",
  "Typing :: Typed",
]
# Deliberately small. Everything heavy is an extra, and every bound below is
# capped where a major release is known-breaking and we touch internals.
#
# typer's floor is 0.16, not 0.12: 0.12 allows any click 8.x and silently
# mis-parses Annotated options against click >= 8.2, so `--force` defaults to
# true and `lkb init` overwrites a config it should refuse to touch. The floors
# job found that; nothing else would have.
dependencies = [
  "pydantic>=2.9,<3", "httpx>=0.27,<1", "numpy>=1.26,<3",
  "typer>=0.16,<1", "rich>=13.7,<15", "pyyaml>=6,<7",
  "python-dateutil>=2.9,<3",
]

[project.urls]
Homepage = "https://github.com/rajo69/ledgerkb"
Documentation = "https://github.com/rajo69/ledgerkb/tree/main/docs"
Source = "https://github.com/rajo69/ledgerkb"

[project.optional-dependencies]
# Split so L1 does not drag L2's 40MB onnxruntime onto the critical path of
# every test run. `local` is kept as the union for compatibility.
# A floor means "we support this and the floors job proves it", not "this is
# the oldest release on PyPI". The originals pointed at 2021-era versions that
# have no wheels for a supported Python and had never been run.
parsers  = ["pypdfium2>=4.30,<6", "python-docx>=1.1,<2", "openpyxl>=3.1,<4",
            "selectolax>=0.3.21,<1", "python-pptx>=1.0,<2"]   # all MIT/BSD/Apache
embed    = ["fastembed>=0.6,<1"]
extract  = ["instructor>=1.6,<2"]       # structured output; pulls the openai SDK
local    = ["ledgerkb[parsers,embed]"]
postgres = ["psycopg[binary]>=3.2", "pgvector>=0.3"]
docling  = ["docling>=2"]
obs      = ["opentelemetry-sdk>=1.27", "opentelemetry-exporter-otlp-proto-http>=1.27"]
litellm  = ["litellm>=1.50"]
pdf      = ["typst>=0.11"]
vec      = ["sqlite-vec>=0.1.7"]        # optional accelerator; still alpha
all      = ["ledgerkb[local,extract,postgres,docling,obs,pdf,vec]"]

[project.scripts]
lkb = "ledgerkb.cli.main:app"

[dependency-groups]                      # PEP 735 — dev only, never shipped
# Lint and type tools are pinned exactly: they are the ones that redden CI with
# no code change, because `select` names rule *families* and any new rule in one
# fails a clean tree. Renovate bumps them in their own PR, where the new-lint
# diff is reviewable instead of landing on somebody's unrelated change.
# Every entry carries a floor. An unversioned dev tool resolves to whatever
# 0.0.1 placeholder was uploaded in 2011 when the floors job asks for the
# lowest direct version, and those sdists do not build.
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24", "pytest-cov>=5",
       "hypothesis>=6.100", "respx>=0.21", "import-linter>=2.0",
       "pytest-examples>=0.0.15",
       "ruff==0.16.2", "mypy==2.3.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/ledgerkb"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E","F","I","N","UP","B","SIM","RUF","ANN","S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN", "S101"]            # asserts and untyped fixtures are fine in tests
# Adapter boundaries are deliberately open: provider kwargs pass through to
# somebody else's SDK, store filters are per-backend, and JSON columns hold
# arbitrary values. Narrowing these to a closed type would be a fiction.
"src/ledgerkb/core/ports.py" = ["ANN401"]
"src/ledgerkb/providers/*.py" = ["ANN401"]
"src/ledgerkb/storage/base.py" = ["ANN401"]
"src/ledgerkb/storage/*/store.py" = ["ANN401"]

[tool.mypy]
strict = true
files = ["src/ledgerkb/core"]

[tool.pytest.ini_options]
addopts = "-q --cov=ledgerkb --cov-report=term-missing"
testpaths = ["tests"]
markers = ["live: requires real provider credentials"]
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
branch = true
source = ["src/ledgerkb"]

# --- import-linter: core/ stays pure -----------------------------------------
[tool.importlinter]
root_packages = ["ledgerkb"]
# Required for the contract below that forbids third-party imports in core/.
include_external_packages = true

[[tool.importlinter.contracts]]
name = "core imports nothing from the rest of ledgerkb"
type = "forbidden"
source_modules = ["ledgerkb.core"]
forbidden_modules = [
  "ledgerkb.storage", "ledgerkb.providers", "ledgerkb.ingest", "ledgerkb.index",
  "ledgerkb.extract", "ledgerkb.ledger", "ledgerkb.project", "ledgerkb.evals",
  "ledgerkb.obs", "ledgerkb.cli",
]

[[tool.importlinter.contracts]]
name = "core imports no third-party package except pydantic"
type = "forbidden"
source_modules = ["ledgerkb.core"]
forbidden_modules = [
  "httpx", "numpy", "typer", "rich", "yaml", "dateutil", "instructor",
  "sqlite3", "openai", "anthropic", "litellm",
]

[[tool.importlinter.contracts]]
name = "layered architecture"
type = "layers"
layers = [
  "ledgerkb.cli",
  "ledgerkb.project | ledgerkb.evals",
  "ledgerkb.ledger",
  "ledgerkb.extract",
  "ledgerkb.index",
  "ledgerkb.ingest",
  "ledgerkb.storage | ledgerkb.providers",
  "ledgerkb.obs",
  "ledgerkb.core",
]
