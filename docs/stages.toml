[[stage]]
id = "L6"
track = "library"
title = "Refresh and change report"
status = "not-started"
ships = "v0.4.0"
effort = "~1.5 days"
risk = "high"
goal = "Belief revision with preserved history. This is the differentiator."
summary = """
Content-hash diffing classifies every document as unchanged, modified, new or
disappeared. Reconciliation produces the seven update categories. Invalidation is
bitemporal: set invalid_at and record what invalidated it, never delete.
Contradictions become two active disputed assertions and are never merged. The
change report is rendered from stored change events rather than recomputed.
"""
gate = [
  { text = "Unchanged documents cost zero LLM calls, asserted by a call-counting test", met = false },
  { text = "\"What did we believe on date D?\" returns the correct historical state", met = false },
  { text = "All seven update categories are produced on a scripted document containing each", met = false },
  { text = "Contradictions surface as two assertions, and a blended single answer is a test failure", met = false },
  { text = "Change-report precision at or above 0.90 against human review of the scripted document", met = false },
  { text = "A full replay from scratch yields the same final ledger state with LLM calls stubbed", met = false },
]

