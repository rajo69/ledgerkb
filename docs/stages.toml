# The one source of truth for where this project is.
#
# Every document that states stage status is generated from this file. Edit it,
# then run `python scripts/render_docs.py`. CI runs the renderer in --check mode,
# so a status change that does not regenerate the documents fails the build.
#
# status is one of: done | in-progress | not-started
# A gate item's `met` is a fact about the repository, not an intention. If you
# cannot point at a passing check, it is false.

schema_version = 1
current = "L2"

# Shown in the README status block. Keep it to a few lines and keep it true:
# the largest risk in this repository's documentation is claiming more than the
# code delivers.
works_today = """
Documents go in and ranked passages come out. Ingest reads files, directories
and ZIP archives; tier-0 parsers cover ten formats; the sanitiser strips
invisible text and quarantines instruction-shaped spans; the chunker slices on
document structure and every chunk slices back to byte-identical source text.
Search runs three arms (dense, BM25 and heading path), fuses them by rank, and
explains where each arm placed every candidate. All of it runs with no API key
and no network.

Grounded answering, the assertion ledger, the knowledge graph, the change report
and the exports are designed and gated but not built.
"""

