  { text = "Over-merge rate at or below 0.02 on a labelled pair set, because over-merging is the failure that matters", met = false },
  { text = "Every merge is reversible and a reversal test passes", met = false },
  { text = "All five example queries execute and return sensible results on the fixture corpus", met = false },
